<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="title">Jiao Translator</div>

  <label class="row">
    <input id="enabled" type="checkbox">
    <img class="option-logo" src="icons/icon32.png" alt="">
    <span>启用划词翻译</span>
  </label>

  <button id="openReader" class="reader-button" type="button">
    <img class="option-logo" src="icons/icon32.png" alt="">
    <span>打开 PDF 阅读器</span>
  </button>

  <button id="startServer" class="reader-button" type="button">
    <span aria-hidden="true">▶</span>
    <span>启动本地后端</span>
  </button>

  <div id="serverStatus" class="status" role="status" aria-live="polite">正在检查后端…</div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
